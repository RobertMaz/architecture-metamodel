# Клиентские api-библиотеки: артефакт -> контейнер-цель (п. 8 плана).
# Зависимость в pom/gradle даёт ребро «использует клиента» (conf 0.6);
# с jar: либа профилируется ASM (Feign, call-sites) -> рёбра в конкретные
# операции (0.7), а байткод сервиса подтверждает реально вызываемые (0.85).
# Кэш профилей — workspace/_clientlibs/. Пополняется руками, как aliases.
#
# clientlibs:
#   com.acme:billing-client:
#     container: shop.billing
#     jar: /path/to/billing-client.jar
clientlibs: {}
